# Weekly pull requests for dependency updates. CI runs on each, so a green
# Dependabot PR is safe to merge.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [type:chore, area:dependencies]
    groups:
      # One PR for all minor/patch bumps instead of one per crate.
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [type:chore, area:ci]
