# Continuous integration: every pull request (and every push to main or v1)
# must pass formatting, lint, unit tests, the web UI build and the PostgreSQL
# integration test. Branch protection on `main` and `v1` requires all jobs to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, unit tests
    # Windows: the app uses Media Foundation and Windows OCR.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  linux:
    name: Linux build and unit tests
    # Headless build, as in the Docker image: no desktop window, PaddleOCR
    # for OCR, Video4Linux for the camera.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # bindgen (for the Video4Linux bindings) needs libclang.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets --locked --no-default-features --features paddle-ocr -- -D warnings
      - name: Unit tests
        run: cargo test --locked --no-default-features --features paddle-ocr

  docker:
    name: Docker image
    # Builds the image and runs it: alone (SQLite), then with compose.yaml's
    # PostgreSQL profile.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/johnflarson/scan-capture-card:ci
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runs and turns healthy (SQLite, no camera)
        run: |
          docker run -d --name tome -p 127.0.0.1:8787:8787 "$IMAGE"
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tome)
            [ "$status" = healthy ] && break
            sleep 3
          done
          docker logs tome
          test "$status" = healthy
          curl -fsS http://127.0.0.1:8787/api/health
          curl -fsS -o /dev/null http://127.0.0.1:8787/
          curl -fsS http://127.0.0.1:8787/api/session | grep -q '"camera_error"'
          docker exec tome mtg-scan db status
          docker rm -f tome
      - name: OCR runs (ONNX Runtime loads, models are in the image)
        run: |
          mkdir -p ocr-test
          python3 -c "import zlib,struct;w,h=64,32;raw=b''.join(b'\x00'+b'\xff'*w*3 for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('ocr-test/blank.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
          docker run --rm -v "$PWD/ocr-test:/img:ro" "$IMAGE" ocr-dump /img/blank.png --engine paddle
      - name: compose.yaml with PostgreSQL
        run: |
          cat > .env <<'EOF'
          MTG_SCAN_IMAGE_TAG=ci
          MTG_SCAN_STORAGE=postgres
          MTG_SCAN_DB_HOST=postgres
          MTG_SCAN_DB_USER=mtg
          MTG_SCAN_DB_PASSWORD=ci-only-password
          MTG_SCAN_DB_NAME=mtg
          EOF
          docker compose --profile postgres up -d --wait postgres
          docker compose --profile postgres run --rm --no-deps mtg-scan db migrate
          docker compose --profile postgres up -d --no-build --wait --wait-timeout 180 mtg-scan
          docker compose exec mtg-scan mtg-scan db status
          curl -fsS http://127.0.0.1:8787/api/health
      - name: Logs
        if: always()
        run: docker compose --profile postgres logs || true

  web-ui:
    name: Web UI (WebAssembly)
    # The UI is plain Rust compiled to WebAssembly: no Windows APIs needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Lint (warnings are errors)
        run: cargo clippy -p mtg-scan-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the UI bundle
        working-directory: ui
        run: trunk build --release

  integration:
    name: PostgreSQL integration test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub's Windows runners ship PostgreSQL with the service stopped
      # (superuser postgres / password root).
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $svc -StartupType Automatic -Status Running
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432 -t 60
      - name: Integration tests (ignored tests)
        run: cargo test --locked -- --ignored
        env:
          MTG_SCAN_TEST_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres
