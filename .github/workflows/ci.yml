# Continuous integration: every pull request (and every push to main or v1)
# must pass formatting, lint, unit tests, the web UI build and the PostgreSQL
# integration test. Branch protection on `main` and `v1` requires all jobs to pass.
name: CI

on:
  pull_request:
  push:
    branches: [main, v1]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, unit tests
    # Windows: the app uses Media Foundation and Windows OCR.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --locked

  linux:
    name: Linux build and unit tests
    # Headless build, as in the Docker image: no desktop window, PaddleOCR
    # for OCR, Video4Linux for the camera.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # bindgen (for the Video4Linux bindings) needs libclang.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libclang-dev
      - name: Lint (warnings are errors)
        run: cargo clippy --all-targets --locked --no-default-features --features paddle-ocr -- -D warnings
      - name: Unit tests
        run: cargo test --locked --no-default-features --features paddle-ocr

  web-ui:
    name: Web UI (WebAssembly)
    # The UI is plain Rust compiled to WebAssembly: no Windows APIs needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Lint (warnings are errors)
        run: cargo clippy -p mtg-scan-ui --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build the UI bundle
        working-directory: ui
        run: trunk build --release

  integration:
    name: PostgreSQL integration test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # GitHub's Windows runners ship PostgreSQL with the service stopped
      # (superuser postgres / password root).
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*'
          Set-Service -InputObject $svc -StartupType Automatic -Status Running
          & "$env:PGBIN\pg_isready.exe" -h localhost -p 5432 -t 60
      - name: Integration tests (ignored tests)
        run: cargo test --locked -- --ignored
        env:
          MTG_SCAN_TEST_DATABASE_URL: postgres://postgres:root@localhost:5432/postgres
