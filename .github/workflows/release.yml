# Continuous delivery: pushing a version tag (e.g. `git tag v0.3.0 && git push
# origin v0.3.0`) builds the Windows release and publishes it on GitHub with
# the matching CHANGELOG.md section as release notes. A pre-release tag such as
# v1.0.0-alpha.1 (from the v1 branch) is published as a GitHub pre-release.
# From 1.0 on, the Docker image is also pushed to GitHub's container registry
# as ghcr.io/johnflarson/scan-capture-card:<version> and :latest.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Tag must match Cargo.toml version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$v]' section" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 notes.md

      - name: Test
        run: cargo test --locked

      # Built first: `cargo build` embeds ui/dist into the binary.
      - name: Build web UI
        working-directory: ui
        run: trunk build --release

      - name: Build
        # Usage statistics report this copy as the Windows release.
        env:
          MTG_SCAN_BUILD: windows-release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "mtg-scan-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/mtg-scan.exe, README.md, CHANGELOG.md, mtg-scan.example.toml, .env.example -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $releaseArgs = @($tag, '--title', "mtg-scan $tag", '--notes-file', 'notes.md', "${{ env.ASSET }}.zip", "${{ env.ASSET }}.zip.sha256")
          # A version with a pre-release part (v1.0.0-alpha.1) is a GitHub pre-release.
          if ($tag.Contains('-')) { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "${{ github.ref_name }}" || { echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Only the 1.0 line publishes images, alpha releases included, so
          # `latest` is the newest of them.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
