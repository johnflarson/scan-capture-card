# mtg-scan configuration. Copy to `mtg-scan.toml` (in the directory you run
# mtg-scan from) or to %APPDATA%\mtg-scan\config.toml. Every setting is optional.

# Markdown file the collection is stored in (markdown backend), and the
# default file for `db import` / `db export`.
collection = "collection.md"

[storage]
# sqlite = one file with price history (default) | postgres = your own
# PostgreSQL server with price history | markdown = collection.md, no history
backend = "sqlite"
# SQLite file (default: collection.db in %LOCALAPPDATA%\mtg-scan, or in
# MTG_SCAN_DATA_DIR when set).
# path = "collection.db"
# Connection details and the password go in the `.env` file next to this one
# (copy .env.example): MTG_SCAN_DB_HOST / _PORT / _USER / _PASSWORD / _NAME /
# _SSLMODE, or a single MTG_SCAN_DATABASE_URL connection string.
# Use a direct / session-mode connection, not a transaction-mode pooler
# (e.g. Supabase port 6543): the driver uses prepared statements.
# Schema the tables live in; created automatically.
schema = "mtg_scan"

[prices]
# Prices come from Scryfall's daily data: TCGplayer (USD), Cardmarket (EUR)
# and MTGO tix. Totals and the most valuable cards use: usd | eur
currency = "usd"
# Also record Card Kingdom retail + buylist prices (its public ~70 MB price
# list, downloaded at most daily):
card_kingdom = false

[camera]
# Index from `mtg-scan cameras`. Leave unset to auto-pick the Insta360.
# index = 0
# Capture size in single-card mode (`scan`).
width = 1920
height = 1080
# Capture size in table mode (`scan-all`): every card in view, so go large.
table_width = 3840
table_height = 2160
# Height of the single-card guide as a fraction of the frame.
guide_height = 0.85

[recognition]
# ocr  = OCR only (offline, fast)
# llm  = vision LLM only
# auto = OCR first, LLM when OCR can't pin down the card
mode = "auto"
# The OCR engine:
# auto    = PaddleOCR; on Windows, Windows OCR when PaddleOCR can't load
# paddle  = PaddleOCR (its models, ~13 MB, are downloaded on first use)
# windows = Windows' built-in OCR (Windows only; needs the card close to the camera)
ocr = "auto"
# How table mode (`scan-all`) finds the cards:
# auto      = by their black borders; the vision LLM only when that finds none
# classical = by their black borders only (no LLM)
# llm       = the vision LLM (slower; copes with fanned piles)
detection = "auto"
# Save every captured image here (handy for tuning recognition).
# save_scans = "scans"
# Web UI: when the printing is uncertain (amber), hold the card in a review
# list (accept, pick another printing, or discard) instead of saving it.
review_uncertain = true
# Language your cards are printed in (Scryfall code: en, de, fr, it, es, pt,
# ja, ko, ru, zhs, zht): scans record that printing when Scryfall has it.
# The default for accounts that haven't chosen one on the Settings page.
card_language = "en"

[llm]
# none | ollama | lmstudio | openrouter | openai | anthropic | gemini
provider = "ollama"
# Defaults per provider:
#   ollama     -> qwen3-vl:8b-instruct   (ollama pull qwen3-vl:8b-instruct)
#   lmstudio   -> qwen/qwen3-vl-8b
#   openrouter -> google/gemini-2.5-flash (needs OPENROUTER_API_KEY)
#   openai     -> gpt-5-mini              (needs OPENAI_API_KEY)
#   anthropic  -> claude-opus-5-5         (needs ANTHROPIC_API_KEY)
#   gemini     -> gemini-2.5-flash        (needs GEMINI_API_KEY)
# Cloud keys can also be each person's own (web UI, Settings -> Vision model).
# `mtg-scan llm check` tells whether the model is ready.
# model = "qwen3-vl:8b-instruct"
# base_url = "http://localhost:11434"
# Name of the environment variable holding the API key (openrouter/openai).
# api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 120

# Defaults for accounts' own settings (the web UI's Settings page saves those
# with each account). The first account also starts with [decks] below.
[ui]
# How scanning starts; --manual, --table and --finish override them.
auto_scan = true
table_mode = false
finish = "nonfoil"

[decks]
# Moxfield user name or profile link. Wins over MTG_SCAN_MOXFIELD_USER in .env;
# "" means no account.
# moxfield_user = "https://moxfield.com/users/YourName"
# Moxfield deck IDs left off the Decks page and out of deck statistics.
hidden = []

# Set by the web UI's setup wizard.
[telemetry]
# Whether anonymous usage statistics may be sent: once a day while `mtg-scan ui`
# runs, the version, platform, setup choices, rounded scan counts and kinds of
# errors, with a random id for this server; never cards, images, names or keys.
# Unset until answered (nothing is sent). `mtg-scan telemetry show` prints the
# next ping in full. DO_NOT_TRACK=1 in the environment turns it off.
# enabled = false
# Send them to your own collector instead (MTG_SCAN_TELEMETRY_URL wins).
# url = "https://www.luminaldata.com/app/shufflingtome/v1/ping"

[setup]
# The setup wizard was finished or skipped (false shows it to admins again).
done = false
