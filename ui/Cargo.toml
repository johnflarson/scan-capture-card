[package]
name = "mtg-scan-ui"
version = "0.2.0"
edition = "2024"
description = "mtg-scan web UI (Leptos, compiled to WebAssembly by Trunk)"
license = "MIT"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-net = "0.7"
gloo-timers = { version = "0.3", features = ["futures"] }
leptos = { version = "0.8.22", features = ["csr"] }
mtg-scan-shared = { path = "../shared" }
serde = "1"
serde_json = "1"
