[package]
name = "mtg-scan-ui"
version = "1.0.0-alpha.0"
edition = "2024"
description = "mtg-scan web UI (Leptos, compiled to WebAssembly by Trunk)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
leptos = { version = "0.8.22", features = ["csr"] }
mtg-scan-shared = { path = "../shared" }
serde = "1"
serde_json = "1"
# Where a card sits on screen, for the Collection card view's deck popup.
web-sys = { version = "0.3", features = ["DomRect", "Element"] }
