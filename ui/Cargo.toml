[package]
name = "mtg-scan-ui"
version = "1.0.0-alpha.0"
edition = "2024"
description = "mtg-scan web UI (Leptos, compiled to WebAssembly by Trunk)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
console_error_panic_hook = "0.1"
futures = "0.3"
gloo-net = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
leptos = { version = "0.8.22", features = ["csr"] }
mtg-scan-shared = { path = "../shared" }
serde = "1"
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# Where a card sits on screen (the Collection card view's deck popup), the
# camera of this device (`camera.rs`), and the address bar (`auth.rs`).
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "DomRect",
    "Element",
    "History",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "Location",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Storage",
    "Window",
] }
